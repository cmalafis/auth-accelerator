name: Release

# Tag a release to publish binaries (GitHub Releases) and the UBI image (quay).
#   git tag v0.2.0 && git push origin v0.2.0
#
# The container image requires repo secrets QUAY_USERNAME and QUAY_TOKEN.
# If you only want binaries, drop the `dockers`/`docker_manifests` sections
# from .goreleaser.yaml and the Quay login step below.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
